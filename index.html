<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生命时钟 — 已行与余晖</title>
  <meta name="description" content="将八十年映照为一天。看已行的时刻，也看见尚未散尽的余晖。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="season-spring" data-bg="0">
  <div class="bg" aria-hidden="true">
    <div class="bg-wash" id="bg-wash"></div>
    <div class="bg-season" id="bg-season"></div>
    <div class="bg-grain"></div>
    <canvas id="season-canvas" class="season-canvas"></canvas>
    <canvas id="star-canvas" class="star-canvas" hidden></canvas>
  </div>

  <main class="page">
    <header class="hero">
      <p class="brand">生命时钟</p>
      <h1 class="headline">八十载，浓缩成一天</h1>
      <p class="lede">左边是已经走过的时辰，右边是还没散尽的余晖。</p>

      <form class="form" id="birth-form" autocomplete="off">
        <label class="field">
          <span class="label">出生日期</span>
          <input type="date" id="birth-date" value="2000-10-05" required />
        </label>
        <button type="submit" class="btn">启动时钟</button>
      </form>
    </header>

    <p class="compare" id="compare-line">现实 --:--:-- · 人生 --:--:--</p>
    <p class="season-tag" id="season-tag">春 · 晨光初启</p>

    <div class="progress-wrap" aria-label="人生进度">
      <svg class="progress-ring" viewBox="0 0 120 120">
        <circle class="progress-track" cx="60" cy="60" r="52" />
        <circle class="progress-elapsed" id="progress-elapsed" cx="60" cy="60" r="52" />
        <circle class="progress-remain" id="progress-remain" cx="60" cy="60" r="44" />
      </svg>
      <div class="progress-copy">
        <p class="progress-pct" id="progress-pct">--%</p>
        <p class="progress-sub" id="progress-sub">已走过的人生</p>
      </div>
    </div>

    <section class="clocks" id="clocks" data-active="false" aria-live="polite">
      <article class="clock-card elapsed">
        <header class="clock-head">
          <p class="kicker" id="elapsed-kicker">已行</p>
          <p class="digital" id="elapsed-digital">--:--:--</p>
        </header>

        <div class="face-wrap drag-face" id="elapsed-face-wrap" title="拖动指针，预览人生的其他时刻">
          <svg class="face" id="elapsed-face" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.2" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <circle class="dial" cx="100" cy="100" r="92" />
            <circle class="dial-inner" cx="100" cy="100" r="78" />
            <g class="ticks" data-ticks="elapsed"></g>
            <g class="hours" data-hours="elapsed"></g>
            <g id="milestones" class="milestones"></g>
            <line class="hand hour" id="elapsed-hour" x1="100" y1="100" x2="100" y2="52" />
            <line class="hand minute" id="elapsed-minute" x1="100" y1="100" x2="100" y2="36" />
            <line class="hand second" id="elapsed-second" x1="100" y1="108" x2="100" y2="28" />
            <circle class="hub" cx="100" cy="100" r="4" />
          </svg>
          <p class="drag-hint" id="drag-hint">可拖动预览</p>
        </div>

        <p class="meta" id="elapsed-meta">等待启程</p>
        <ul class="milestone-list" id="milestone-list"></ul>
      </article>

      <div class="bridge" aria-hidden="true">
        <span class="bridge-line"></span>
        <span class="bridge-label" id="now-label">此刻</span>
        <span class="bridge-line"></span>
      </div>

      <article class="clock-card afterglow">
        <header class="clock-head">
          <p class="kicker" id="afterglow-kicker">余晖</p>
          <p class="digital" id="afterglow-digital">--:--:--</p>
        </header>

        <div class="face-wrap">
          <svg class="face" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="dial" cx="100" cy="100" r="92" />
            <circle class="dial-inner" cx="100" cy="100" r="78" />
            <g class="ticks" data-ticks="afterglow"></g>
            <g class="hours" data-hours="afterglow"></g>
            <line class="hand hour" id="afterglow-hour" x1="100" y1="100" x2="100" y2="52" />
            <line class="hand minute" id="afterglow-minute" x1="100" y1="100" x2="100" y2="36" />
            <line class="hand second" id="afterglow-second" x1="100" y1="108" x2="100" y2="28" />
            <circle class="hub" cx="100" cy="100" r="4" />
          </svg>
        </div>

        <p class="meta" id="afterglow-meta">余晖未至</p>
      </article>
    </section>

    <p class="caption" id="caption">输入生日，让两只钟开始走动</p>

    <div class="poetry" id="poetry">
      <p class="poetry-label">人生诗签</p>
      <p class="poetry-text" id="poetry-text" aria-live="polite">启动时钟后抽取一句</p>
      <div class="poetry-actions">
        <button type="button" class="poetry-refresh" id="poetry-refresh">换一句</button>
        <button type="button" class="poetry-refresh" id="poetry-auto" aria-pressed="false">动态播放</button>
      </div>
    </div>

    <label class="note-box">
      <span class="note-label">写给此刻的自己</span>
      <textarea id="life-note" rows="2" maxlength="80" placeholder="一句留给此刻的话…"></textarea>
    </label>

    <div class="actions">
      <button type="button" class="action-btn" id="sound-btn" aria-pressed="false" title="音景开关">
        <span class="action-ico" aria-hidden="true">♪</span>
        <span id="sound-label">开启音景</span>
      </button>
      <button type="button" class="action-btn" id="mirror-btn" aria-pressed="false" title="若再活一天">
        <span class="action-ico" aria-hidden="true">⇄</span>
        <span id="mirror-label">若再活一天</span>
      </button>
      <button type="button" class="action-btn" id="bg-btn" title="换背景">
        <span class="action-ico" aria-hidden="true">◈</span>
        <span>换背景</span>
      </button>
      <button type="button" class="action-btn" id="share-btn" title="生成分享卡">
        <span class="action-ico" aria-hidden="true">▦</span>
        <span>生成分享卡</span>
      </button>
    </div>

    <footer class="foot">按 80 年 = 24 小时计算 · 仅本地演算</footer>
  </main>

  <canvas id="share-canvas" width="1080" height="1400" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
